baseURL: "https://eliza-notes.com/"
title: "Eliza's Notes"
paginate: 10
theme: hugo-PaperMod
locale: zh-CN
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

author:
  name: "Eliza Chen"
  email: "819407190@qq.com"

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - JSON
  page:
    - HTML
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowToc: true 
  TocOpen: true   
  displayFullLangName: true
  
  mainSections:
    - blog
  
  socialIcons:
    - name: github
      url: "https://github.com/eliza0908"
    - name: email
      url: "mailto:819407190@qq.com"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys:
      - title
      - permalink
      - summary
      - content

languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    params:
      languageAltTitle: "切换至中文"
    menu:
      main:
        - name: 研究
          url: /research/
          weight: 1
        - name: 阅读
          url: /reading/
          weight: 2
        - name: 电影
          url: /films/
          weight: 3
        - name: 生活
          url: /life/
          weight: 4
        - name: 关于
          url: /about/
          weight: 5
        - name: 标签
          url: /tags/
          weight: 6
        - name: 搜索
          url: /search/
          weight: 7
  en:
    label: "English"
    locale: "en-US"
    weight: 2
    params:
      languageAltTitle: "Switch to English"
    menu:
      main:
        - name: Research
          url: /research/
          weight: 1
        - name: Reading
          url: /reading/
          weight: 2
        - name: Films
          url: /films/
          weight: 3
        - name: Life
          url: /life/
          weight: 4
        - name: About
          url: /about/
          weight: 5
        - name: Tags
          url: /tags/
          weight: 6
        - name: Search
          url: /search/
          weight: 7
